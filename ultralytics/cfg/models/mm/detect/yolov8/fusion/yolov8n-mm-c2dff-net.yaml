# 感谢多模态群友 Accepted 对本文件复现以及分享
# C2DFF-Net RGB+Depth port. Source family: YOLOv8 dual-CSP + CDFIM + CGSA.
nc: 80
scale: n
dataset_config:
  modality_used: [rgb, depth]
  Pch: 3
  Xch: 3
  Tch: 0
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2], A]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]                    # 4 RGB P3
  - [-1, 1, Conv, [64, 3, 2], B]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]                    # 9 Depth P3
  - [[4, 9], 1, C2DFFCdfim, [4]]                 # 10
  - [10, 1, Index, [0]]                          # 11 RGB P3 enhanced
  - [10, 1, Index, [1]]                          # 12 Depth P3 enhanced

  - [11, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]                    # 14 RGB P4
  - [12, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]                    # 16 Depth P4
  - [[14, 16], 1, C2DFFCdfim, [4]]               # 17
  - [17, 1, Index, [0]]                          # 18
  - [17, 1, Index, [1]]                          # 19

  - [18, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]                     # 22 RGB P5
  - [19, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]                     # 25 Depth P5
  - [[22, 25], 1, C2DFFCdfim, [4]]               # 26
  - [26, 1, Index, [0]]                          # 27
  - [26, 1, Index, [1]]                          # 28
  - [[11, 12], 1, C2DFFCgsa, [True]]             # 29 fused P3
  - [[18, 19], 1, C2DFFCgsa, [True]]             # 30 fused P4
  - [[27, 28], 1, C2DFFCgsa, [True]]             # 31 fused P5

head:
  - [31, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 30], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 29], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]                          # 36 P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 34], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]                          # 39 P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 31], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]                         # 42 P5
  - [[36, 39, 42], 1, v8Detect, [nc]]
