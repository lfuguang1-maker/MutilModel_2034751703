# 感谢多模态群友 Accepted 对本文件复现以及分享
# EI2Det reproduction on its source ICAFusion/YOLOv5 detector family.
nc: 80
scale: n
dataset_config: {modality_used: [rgb, depth], Pch: 3, Xch: 3, Tch: 0}
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 1024]
  l: [1.00, 1.00, 1024]
  x: [1.33, 1.25, 1024]
backbone:
  - [-1, 1, Conv, [64, 6, 2, 2], A]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C3, [128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C3, [256]]                            # 4 RGB P3
  - [-1, 1, Conv, [64, 6, 2, 2], B]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C3, [128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C3, [256]]                            # 9 Depth P3
  - [[4, 9], 1, EI2DetFusion, [8, 8, 1, 0.0, 0.2]]
  - [4, 1, Conv, [512, 3, 2]]
  - [-1, 9, C3, [512]]                            # 12 RGB P4
  - [9, 1, Conv, [512, 3, 2]]
  - [-1, 9, C3, [512]]                            # 14 Depth P4
  - [[12, 14], 1, EI2DetFusion, [8, 8, 1, 0.0, 0.2]]
  - [12, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C3, [1024]]
  - [-1, 1, SPPF, [1024, 5]]                     # 18 RGB P5
  - [14, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C3, [1024]]
  - [-1, 1, SPPF, [1024, 5]]                     # 21 Depth P5
  - [[18, 21], 1, EI2DetFusion, [8, 8, 1, 0.0, 0.2]]
head:
  - [22, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, C3, [512, False]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C3, [256, False]]                    # 30 P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 26], 1, Concat, [1]]
  - [-1, 3, C3, [512, False]]                    # 33 P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 23], 1, Concat, [1]]
  - [-1, 3, C3, [1024, False]]                   # 36 P5
  - [[30, 33, 36], 1, Detect, [nc]]
