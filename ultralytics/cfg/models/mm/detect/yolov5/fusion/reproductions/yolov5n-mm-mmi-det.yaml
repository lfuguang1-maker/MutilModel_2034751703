# 感谢多模态群友 Accepted 对本文件复现以及分享
# MMI-Det reproduction on its source YOLOv5 family (nano-scaled benchmark variant).
nc: 80
scale: n
dataset_config: {modality_used: [rgb, depth], Pch: 3, Xch: 3, Tch: 0}
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 1024]
  l: [1.00, 1.00, 1024]
  x: [1.33, 1.25, 1024]
backbone:
  - [-1, 1, Conv, [64, 6, 2, 2], A]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C3, [128]]                              # 2 RGB P2
  - [-1, 1, Conv, [64, 6, 2, 2], B]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C3, [128]]                              # 5 Depth P2
  - [[2, 5], 1, MMIDetInteraction, [8, 8, 8, 4.0, 8, 0.1, 0.1, 0.1, True, 8]]
  - [6, 1, Index, [0]]
  - [6, 1, Index, [1]]
  - [7, 1, Conv, [256, 3, 2]]
  - [-1, 6, C3, [256]]                              # 10 RGB P3
  - [8, 1, Conv, [256, 3, 2]]
  - [-1, 6, C3, [256]]                              # 12 Depth P3
  - [[10, 12], 1, MMIDetInteraction, [8, 8, 8, 4.0, 8, 0.1, 0.1, 0.1, False, 8]]
  - [13, 1, Index, [0]]
  - [13, 1, Index, [1]]
  - [14, 1, Conv, [512, 3, 2]]
  - [-1, 9, C3, [512]]                              # 17 RGB P4
  - [15, 1, Conv, [512, 3, 2]]
  - [-1, 9, C3, [512]]                              # 19 Depth P4
  - [[17, 19], 1, MMIDetInteraction, [8, 8, 8, 4.0, 8, 0.1, 0.1, 0.1, False, 8]]
  - [20, 1, Index, [0]]
  - [20, 1, Index, [1]]
  - [21, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C3, [1024]]
  - [-1, 1, SPPF, [1024, 5]]                       # 25 RGB P5
  - [22, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C3, [1024]]
  - [-1, 1, SPPF, [1024, 5]]                       # 28 Depth P5
  - [[25, 28], 1, MMIDetInteraction, [8, 8, 8, 4.0, 8, 0.1, 0.1, 0.1, False, 8]]
  - [29, 1, Index, [0]]
  - [29, 1, Index, [1]]
  - [[14, 15], 1, PairAdd, []]                     # 32 P3
  - [[21, 22], 1, PairAdd, []]                     # 33 P4
  - [[30, 31], 1, PairAdd, []]                     # 34 P5
head:
  - [34, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 33], 1, Concat, [1]]
  - [-1, 3, C3, [512, False]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 32], 1, Concat, [1]]
  - [-1, 3, C3, [256, False]]                      # 42 P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 38], 1, Concat, [1]]
  - [-1, 3, C3, [512, False]]                      # 45 P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 35], 1, Concat, [1]]
  - [-1, 3, C3, [1024, False]]                     # 48 P5
  - [[42, 45, 48], 1, Detect, [nc]]
