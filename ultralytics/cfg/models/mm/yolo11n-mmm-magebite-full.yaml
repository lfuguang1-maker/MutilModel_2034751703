# Ultralytics YOLOMM 🚀 Tri-Modal Three-Stream Full-Fusion Variant (MAGE+BiTE, CVPR 2026)
# 三流完整变体: RGB / thermal / event 各自独立骨干 + P3/P4/P5 三级 MAGEBiTE 级联融合
# 论文: Iaboni & Abichandani, "Tri-Modal Fusion Transformers for UAV-based Object Detection", CVPR 2026
# 数据要求: data.yaml 三槽 A=rgb(3ch), B=thermal(1ch), C=event(1ch)
# 融合策略: 每级先融合 B+C (辅助模态)，再与 A (RGB) 融合，对应论文三流→两两交换的层级形态

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB路径 (层0-10) ==========
  - [-1, 1, Conv, [64, 3, 2], 'A']      # 0-P1/2 RGB路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (RGB_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  # ========== Thermal路径 (层11-21) ==========
  - [-1, 1, Conv, [64, 3, 2], 'B']        # 11-P1/2 Thermal路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15 (T_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (T_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 (T_P5)

  # ========== Event路径 (层22-32) ==========
  - [-1, 1, Conv, [64, 3, 2], 'C']        # 22-P1/2 Event路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 23-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 24
  - [-1, 1, Conv, [256, 3, 2]]            # 25-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 26 (E_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 27-P4/16
  - [-1, 2, C3k2, [512, True]]            # 28 (E_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 29-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 30
  - [-1, 1, SPPF, [1024, 5]]              # 31
  - [-1, 2, C2PSA, [1024]]                # 32 (E_P5)

  # ========== P3/P4/P5 三级 MAGEBiTE 级联融合 ==========
  # P3级: T_P3 + E_P3 -> 与 RGB_P3
  - [[15, 26], 1, MAGEBiTE, []]           # 33 辅助融合: T_P3(15) + E_P3(26)
  - [[4, 33], 1, MAGEBiTE, []]            # 34 (Fused_P3)

  # P4级: T_P4 + E_P4 -> 与 RGB_P4
  - [[17, 28], 1, MAGEBiTE, []]           # 35 辅助融合: T_P4(17) + E_P4(28)
  - [[6, 35], 1, MAGEBiTE, []]            # 36
  - [-1, 2, C3k2, [1024, True]]           # 37 (Fused_P4)

  # P5级: T_P5 + E_P5 -> 与 RGB_P5
  - [[21, 32], 1, MAGEBiTE, []]           # 38 辅助融合: T_P5(21) + E_P5(32)
  - [[10, 38], 1, MAGEBiTE, []]           # 39
  - [-1, 2, C3k2, [1024, True]]           # 40
  - [-1, 1, C2PSA, [1024]]                # 41 (Fused_P5)

# 标准YOLOv11检测头 (Neck + Head)
head:
  # 自顶向下路径 (FPN)
  - [41, 1, nn.Upsample, [None, 2, "nearest"]]  # 42 Fused_P5上采样
  - [[-1, 37], 1, Concat, [1]]                  # 43 连接Fused_P4
  - [-1, 2, C3k2, [512, False]]                 # 44

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 45
  - [[-1, 34], 1, Concat, [1]]                  # 46 连接Fused_P3(34)
  - [-1, 2, C3k2, [256, False]]                 # 47 (P3/8-small)

  # 自底向上路径 (PAN)
  - [-1, 1, Conv, [256, 3, 2]]                  # 48
  - [[-1, 44], 1, Concat, [1]]                  # 49
  - [-1, 2, C3k2, [512, False]]                 # 50 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 51
  - [[-1, 41], 1, Concat, [1]]                  # 52
  - [-1, 2, C3k2, [1024, True]]                 # 53 (P5/32-large)

  - [[47, 50, 53], 1, Detect, [nc]]             # 54 Detect(P3, P4, P5)
