# Ultralytics YOLOMM 🚀 Health-Utility Quad-modal (RGB+Event+Thermal+Depth)
# 四模态健康-效用路由检测器：availability mask + 四路骨干 + P3/P4/P5 四输入 MMHealthFusion
# 要求数据: mm_use_mask: true（契约 mask_channels=4，fused=10ch，input=14ch）

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== Mask 伪源（恒等直通 [B,4,H,W]）==========
  - [-1, 1, MMMask, [], 'Mask']             # 0 availability mask

  # ========== A路径 (RGB) - 层1-11 ==========
  - [-1, 1, Conv, [64, 3, 2], 'A']          # 1-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 2-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]       # 3
  - [-1, 1, Conv, [256, 3, 2]]              # 4-P3/8 (A_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]       # 5
  - [-1, 1, Conv, [512, 3, 2]]              # 6-P4/16
  - [-1, 2, C3k2, [512, True]]              # 7 (A_P4)
  - [-1, 1, Conv, [1024, 3, 2]]             # 8-P5/32
  - [-1, 2, C3k2, [1024, True]]             # 9
  - [-1, 1, SPPF, [1024, 5]]                # 10
  - [-1, 2, C2PSA, [1024]]                  # 11 (A_P5)

  # ========== B路径 (Event) - 层12-22 ==========
  - [-1, 1, Conv, [64, 3, 2], 'B']          # 12
  - [-1, 1, Conv, [128, 3, 2]]              # 13
  - [-1, 2, C3k2, [256, False, 0.25]]       # 14
  - [-1, 1, Conv, [256, 3, 2]]              # 15-P3/8 (B_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]       # 16
  - [-1, 1, Conv, [512, 3, 2]]              # 17-P4/16
  - [-1, 2, C3k2, [512, True]]              # 18 (B_P4)
  - [-1, 1, Conv, [1024, 3, 2]]             # 19-P5/32
  - [-1, 2, C3k2, [1024, True]]             # 20
  - [-1, 1, SPPF, [1024, 5]]                # 21
  - [-1, 2, C2PSA, [1024]]                  # 22 (B_P5)

  # ========== C路径 (Thermal) - 层23-33 ==========
  - [-1, 1, Conv, [64, 3, 2], 'C']          # 23
  - [-1, 1, Conv, [128, 3, 2]]              # 24
  - [-1, 2, C3k2, [256, False, 0.25]]       # 25
  - [-1, 1, Conv, [256, 3, 2]]              # 26-P3/8 (C_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]       # 27
  - [-1, 1, Conv, [512, 3, 2]]              # 28-P4/16
  - [-1, 2, C3k2, [512, True]]              # 29 (C_P4)
  - [-1, 1, Conv, [1024, 3, 2]]             # 30-P5/32
  - [-1, 2, C3k2, [1024, True]]             # 31
  - [-1, 1, SPPF, [1024, 5]]                # 32
  - [-1, 2, C2PSA, [1024]]                  # 33 (C_P5)

  # ========== D路径 (Depth) - 层34-44 ==========
  - [-1, 1, Conv, [64, 3, 2], 'D']          # 34-P1/2 Depth路径起始（槽位D）
  - [-1, 1, Conv, [128, 3, 2]]              # 35-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]       # 36
  - [-1, 1, Conv, [256, 3, 2]]              # 37-P3/8 (D_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]       # 38
  - [-1, 1, Conv, [512, 3, 2]]              # 39-P4/16
  - [-1, 2, C3k2, [512, True]]              # 40 (D_P4)
  - [-1, 1, Conv, [1024, 3, 2]]             # 41-P5/32
  - [-1, 2, C3k2, [1024, True]]             # 42
  - [-1, 1, SPPF, [1024, 5]]                # 43
  - [-1, 2, C2PSA, [1024]]                  # 44 (D_P5)

  # ========== 三尺度健康-效用融合（四模态口径）==========
  # groups [[0,2],[1],[3]]: Appearance=(RGB,Thermal), Motion=(Event), Geometry=(Depth)
  - [[5, 16, 27, 37, 0], 1, MMHealthFusion, [256, [[0, 2], [1], [3]], True]]    # 45 P3 融合
  - [[7, 18, 29, 40, 0], 1, MMHealthFusion, [512, [[0, 2], [1], [3]], True]]    # 46 P4 融合
  - [[11, 22, 33, 44, 0], 1, MMHealthFusion, [1024, [[0, 2], [1], [3]], True]]  # 47 P5 融合

# 标准YOLOv11检测头
head:
  - [47, 1, nn.Upsample, [None, 2, "nearest"]]  # 48
  - [[-1, 46], 1, Concat, [1]]                  # 49
  - [-1, 2, C3k2, [512, False]]                 # 50

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 51
  - [[-1, 45], 1, Concat, [1]]                  # 52
  - [-1, 2, C3k2, [256, False]]                 # 53 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                  # 54
  - [[-1, 50], 1, Concat, [1]]                  # 55
  - [-1, 2, C3k2, [512, False]]                 # 56 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 57
  - [[-1, 47], 1, Concat, [1]]                  # 58
  - [-1, 2, C3k2, [1024, True]]                 # 59 (P5/32-large)

  - [[53, 56, 59], 1, Detect, [nc]]             # 60 Detect(P3, P4, P5)
