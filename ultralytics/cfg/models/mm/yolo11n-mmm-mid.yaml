# Ultralytics YOLOMM 🚀 Trimodal Mid-Fusion Paradigm
# YOLOMM RGB+Event+Thermal 三模态中期融合范式（简化版）
# 核心策略: 三路独立P5骨干网 + P4/P5双层融合 + 标准检测头
# 仿照 yolo11n-mm-mid.yaml 双模态架构扩展到三模态

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# P4/P5双层融合架构（三模态版）
backbone:
  # ========== 路径A (RGB) - 层0-10 ==========
  - [-1, 1, Conv, [64, 3, 2], 'A']        # 0-P1/2 RGB起始
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8 (A_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (A_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (A_P5)

  # ========== 路径B (Event) - 层11-21 ==========
  - [-1, 1, Conv, [64, 3, 2], 'B']        # 11-P1/2 Event起始
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8 (B_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (B_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 (B_P5)

  # ========== 路径C (Thermal) - 层22-32 ==========
  - [-1, 1, Conv, [64, 3, 2], 'C']        # 22-P1/2 Thermal起始
  - [-1, 1, Conv, [128, 3, 2]]            # 23-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 24
  - [-1, 1, Conv, [256, 3, 2]]            # 25-P3/8 (C_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]     # 26
  - [-1, 1, Conv, [512, 3, 2]]            # 27-P4/16
  - [-1, 2, C3k2, [512, True]]            # 28 (C_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 29-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 30
  - [-1, 1, SPPF, [1024, 5]]              # 31
  - [-1, 2, C2PSA, [1024]]                # 32 (C_P5)

  # ========== P4融合 ==========
  - [[6, 17, 28], 1, Concat, [1]]         # 33 P4: A_P4(6) + B_P4(17) + C_P4(28)
  - [-1, 2, C3k2, [1024, True]]           # 34 (Fused_P4)

  # ========== P5融合 ==========
  - [[10, 21, 32], 1, Concat, [1]]        # 35 P5: A_P5(10) + B_P5(21) + C_P5(32)
  - [-1, 2, C3k2, [1024, True]]           # 36
  - [-1, 1, C2PSA, [1024]]                # 37 (Fused_P5)

# 标准YOLOv11检测头 (Neck + Head)
head:
  # 自顶向下路径 (FPN)
  - [37, 1, nn.Upsample, [None, 2, "nearest"]]  # 38 Fused_P5上采样
  - [[-1, 34], 1, Concat, [1]]                  # 39 连接Fused_P4
  - [-1, 2, C3k2, [512, False]]                 # 40

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 41
  - [[-1, 3], 1, Concat, [1]]                   # 42 连接A_P3(3)
  - [-1, 2, C3k2, [256, False]]                 # 43 (P3/8-small)

  # 自底向上路径 (PAN)
  - [-1, 1, Conv, [256, 3, 2]]                  # 44
  - [[-1, 40], 1, Concat, [1]]                  # 45
  - [-1, 2, C3k2, [512, False]]                 # 46 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 47
  - [[-1, 37], 1, Concat, [1]]                  # 48
  - [-1, 2, C3k2, [1024, True]]                 # 49 (P5/32-large)

  - [[43, 46, 49], 1, Detect, [nc]]             # 50 Detect(P3, P4, P5)
