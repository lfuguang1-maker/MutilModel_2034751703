# Ultralytics YOLOMM 🚀 Health-Utility Tri-modal (CVPR 方案 §4.6)
# 三模态健康-效用路由检测器：RGB+Event+Thermal + availability mask
# 结构: MMMask 伪源 + 三路骨干 + P3/P4/P5 三层 MMHealthFusion + 标准检测头
# 要求数据: mm_use_mask: true（契约 mask_channels=3，input_ch = fused_ch + 3）

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== Mask 伪源（恒等直通 [B,3,H,W]）==========
  - [-1, 1, MMMask, [], 'Mask']             # 0 availability mask（不触发新起点）

  # ========== A路径 (RGB) - 层1-11 ==========
  - [-1, 1, Conv, [64, 3, 2], 'A']          # 1-P1/2 RGB路径起始（槽位A）
  - [-1, 1, Conv, [128, 3, 2]]              # 2-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]       # 3
  - [-1, 1, Conv, [256, 3, 2]]              # 4-P3/8 (A_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]       # 5
  - [-1, 1, Conv, [512, 3, 2]]              # 6-P4/16
  - [-1, 2, C3k2, [512, True]]              # 7 (A_P4)
  - [-1, 1, Conv, [1024, 3, 2]]             # 8-P5/32
  - [-1, 2, C3k2, [1024, True]]             # 9
  - [-1, 1, SPPF, [1024, 5]]                # 10
  - [-1, 2, C2PSA, [1024]]                  # 11 (A_P5)

  # ========== B路径 (Event) - 层12-22 ==========
  - [-1, 1, Conv, [64, 3, 2], 'B']          # 12-P1/2 Event路径起始（槽位B）
  - [-1, 1, Conv, [128, 3, 2]]              # 13-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]       # 14
  - [-1, 1, Conv, [256, 3, 2]]              # 15-P3/8 (B_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]       # 16
  - [-1, 1, Conv, [512, 3, 2]]              # 17-P4/16
  - [-1, 2, C3k2, [512, True]]              # 18 (B_P4)
  - [-1, 1, Conv, [1024, 3, 2]]             # 19-P5/32
  - [-1, 2, C3k2, [1024, True]]             # 20
  - [-1, 1, SPPF, [1024, 5]]                # 21
  - [-1, 2, C2PSA, [1024]]                  # 22 (B_P5)

  # ========== C路径 (Thermal) - 层23-33 ==========
  - [-1, 1, Conv, [64, 3, 2], 'C']          # 23-P1/2 Thermal路径起始（槽位C）
  - [-1, 1, Conv, [128, 3, 2]]              # 24-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]       # 25
  - [-1, 1, Conv, [256, 3, 2]]              # 26-P3/8 (C_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]       # 27
  - [-1, 1, Conv, [512, 3, 2]]              # 28-P4/16
  - [-1, 2, C3k2, [512, True]]              # 29 (C_P4)
  - [-1, 1, Conv, [1024, 3, 2]]             # 30-P5/32
  - [-1, 2, C3k2, [1024, True]]             # 31
  - [-1, 1, SPPF, [1024, 5]]                # 32
  - [-1, 2, C2PSA, [1024]]                  # 33 (C_P5)

  # ========== 三尺度健康-效用融合 ==========
  # groups [[0,1],[2]]: Appearance=(RGB,Thermal), Motion=(Event)
  - [[5, 16, 27, 0], 1, MMHealthFusion, [256, [[0, 1], [2]], True]]   # 34 P3 融合
  - [[7, 18, 29, 0], 1, MMHealthFusion, [512, [[0, 1], [2]], True]]   # 35 P4 融合
  - [[11, 22, 33, 0], 1, MMHealthFusion, [1024, [[0, 1], [2]], True]] # 36 P5 融合

# 标准YOLOv11检测头 (Neck + Head)
head:
  # 自顶向下路径 (FPN)
  - [36, 1, nn.Upsample, [None, 2, "nearest"]]  # 37 Fused_P5上采样
  - [[-1, 35], 1, Concat, [1]]                  # 38 连接Fused_P4
  - [-1, 2, C3k2, [512, False]]                 # 39

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 40
  - [[-1, 34], 1, Concat, [1]]                  # 41 连接Fused_P3
  - [-1, 2, C3k2, [256, False]]                 # 42 (P3/8-small)

  # 自底向上路径 (PAN)
  - [-1, 1, Conv, [256, 3, 2]]                  # 43
  - [[-1, 39], 1, Concat, [1]]                  # 44
  - [-1, 2, C3k2, [512, False]]                 # 45 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 46
  - [[-1, 36], 1, Concat, [1]]                  # 47
  - [-1, 2, C3k2, [1024, True]]                 # 48 (P5/32-large)

  - [[42, 45, 48], 1, Detect, [nc]]             # 49 Detect(P3, P4, P5)
