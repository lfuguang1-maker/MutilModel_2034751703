# Ultralytics YOLOMM 🚀 FAE-Det Mid-Fusion Paradigm
# 复现论文 FAE-Det (IEEE TCSVT 2026, DOI 10.1109/TCSVT.2026.3723123) 的三模块融合策略:
#   CSAF: 骨干第 2/3/4 尺度渐进跨模态空间注意力交互 (Eq.4-7)
#   CFM : 骨干输出后频域预对齐 (Eq.12-23), 双路输出配 Index 取分支
#   FAEF: 高低频解耦增强融合 (Eq.24-39), 单路输出送 Neck
# 官方代码未发布, 按论文公式逐式复现; FAEF 末端重组为依 Fig.3/7 的推断实现。
# 依赖 mamba-ssm CUDA 核 (FAEF 低频支路 VSSBlock)。

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB路径 (层0-10) ==========
  - [-1, 1, Conv, [64, 3, 2], 'A']      # 0-P1/2 RGB路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  # ========== X路径 (层11-21) ==========
  - [-1, 1, Conv, [64, 3, 2], 'B']        # 11-P1/2 X路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17
  - [-1, 1, Conv, [1024, 3, 2]]           # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 (X_P5)

  # ========== 骨干内 CSAF 渐进交互（层4/6/8 与 15/17/19 之后，对齐论文第2-4尺度） ==========
  # P2 尺度（层2/13 之后）
  - [[2, 13], 1, CSAF, []]                # 22 CSAF(P2) -> (rgb, ir) 双路
  - [22, 1, Index, [0]]                   # 23 rgb_p2'
  - [22, 1, Index, [1]]                   # 24 ir_p2'
  # P3 尺度（层4/15 之后）
  - [[4, 15], 1, CSAF, []]                # 25 CSAF(P3)
  - [25, 1, Index, [0]]                   # 26 rgb_p3'
  - [25, 1, Index, [1]]                   # 27 ir_p3'
  # P4 尺度（层6/17 之后）
  - [[6, 17], 1, CSAF, []]                # 28 CSAF(P4)
  - [28, 1, Index, [0]]                   # 29 rgb_p4'
  - [28, 1, Index, [1]]                   # 30 ir_p4'
  # P5 尺度（层10/21 之后）
  - [[10, 21], 1, CSAF, []]               # 31 CSAF(P5)
  - [31, 1, Index, [0]]                   # 32 rgb_p5'
  - [31, 1, Index, [1]]                   # 33 ir_p5'

  # ========== CFM 频域预对齐 -> FAEF 高低频融合（P4/P5 两尺度，论文最优配置 CFM#2/FAEF#2） ==========
  # P4 级: CFM + FAEF
  - [[29, 30], 1, CFM, []]                # 34 CFM(P4) -> (rgb_f, ir_f)
  - [34, 1, Index, [0]]                   # 35
  - [34, 1, Index, [1]]                   # 36
  - [[35, 36], 1, FAEF, []]               # 37 FAEF(P4) -> Fused_P4 (128c)
  # P5 级: CFM + FAEF
  - [[32, 33], 1, CFM, []]                # 38 CFM(P5)
  - [38, 1, Index, [0]]                   # 39
  - [38, 1, Index, [1]]                   # 40
  - [[39, 40], 1, FAEF, []]               # 41 FAEF(P5) -> Fused_P5 (256c)

# 标准YOLOv11检测头 (Neck + Head)
head:
  # 自顶向下路径 (FPN)
  - [41, 1, nn.Upsample, [None, 2, "nearest"]]  # 42 Fused_P5上采样
  - [[-1, 37], 1, Concat, [1]]                  # 43 连接Fused_P4
  - [-1, 2, C3k2, [512, False]]                 # 44

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 45
  - [[-1, 27], 1, Concat, [1]]                  # 46 连接 ir_p3'（P3 未做 CFM/FAEF，取 CSAF 增强后的 X 支路）
  - [-1, 2, C3k2, [256, False]]                 # 47 (P3/8-small)

  # 自底向上路径 (PAN)
  - [-1, 1, Conv, [256, 3, 2]]                  # 48
  - [[-1, 44], 1, Concat, [1]]                  # 49
  - [-1, 2, C3k2, [512, False]]                 # 50 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 51
  - [[-1, 41], 1, Concat, [1]]                  # 52
  - [-1, 2, C3k2, [1024, True]]                 # 53 (P5/32-large)

  - [[47, 50, 53], 1, Detect, [nc]]             # 54 Detect(P3, P4, P5)
