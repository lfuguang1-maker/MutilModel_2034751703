# Ultralytics YOLOMM 🚀 Quad-modal Mid-Fusion (standard structure)
# 四模态标准结构：RGB + Event + Thermal + Depth，P4/P5 四输入 Concat 中期融合
# 对应 UAV 的 yolo11n-mmm-mid.yaml 标准结构（无 availability mask、无 health 损失）
# 输入: A=rgb(3ch) B=event(3ch) C=thermal(3ch) D=depth(1ch) → fused 10ch

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== A路径 (RGB) - 层0-10 ==========
  - [-1, 1, Conv, [64, 3, 2], 'A']        # 0-P1/2 RGB路径起始（槽位A）
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (A_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (A_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (A_P5)

  # ========== B路径 (Event) - 层11-21 ==========
  - [-1, 1, Conv, [64, 3, 2], 'B']        # 11-P1/2 Event路径起始（槽位B）
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15 (B_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (B_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 (B_P5)

  # ========== C路径 (Thermal) - 层22-32 ==========
  - [-1, 1, Conv, [64, 3, 2], 'C']        # 22-P1/2 Thermal路径起始（槽位C）
  - [-1, 1, Conv, [128, 3, 2]]            # 23-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 24
  - [-1, 1, Conv, [256, 3, 2]]            # 25-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 26 (C_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 27-P4/16
  - [-1, 2, C3k2, [512, True]]            # 28 (C_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 29-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 30
  - [-1, 1, SPPF, [1024, 5]]              # 31
  - [-1, 2, C2PSA, [1024]]                # 32 (C_P5)

  # ========== D路径 (Depth) - 层33-43 ==========
  - [-1, 1, Conv, [64, 3, 2], 'D']        # 33-P1/2 Depth路径起始（槽位D）
  - [-1, 1, Conv, [128, 3, 2]]            # 34-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 35
  - [-1, 1, Conv, [256, 3, 2]]            # 36-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 37 (D_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 38-P4/16
  - [-1, 2, C3k2, [512, True]]            # 39 (D_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 40-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 41
  - [-1, 1, SPPF, [1024, 5]]              # 42
  - [-1, 2, C2PSA, [1024]]                # 43 (D_P5)

  # ========== P4/P5 四模态拼接融合 ==========
  - [[6, 17, 28, 39], 1, Concat, [1]]     # 44 P4融合
  - [-1, 2, C3k2, [1024, True]]           # 45 (Fused_P4)

  - [[10, 21, 32, 43], 1, Concat, [1]]    # 46 P5融合
  - [-1, 2, C3k2, [1024, True]]           # 47
  - [-1, 1, C2PSA, [1024]]                # 48 (Fused_P5)

# 标准YOLOv11检测头
head:
  - [48, 1, nn.Upsample, [None, 2, "nearest"]]  # 49
  - [[-1, 45], 1, Concat, [1]]                  # 50
  - [-1, 2, C3k2, [512, False]]                 # 51

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 52
  - [[-1, 4], 1, Concat, [1]]                   # 53 连接 A_P3
  - [-1, 2, C3k2, [256, False]]                 # 54 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                  # 55
  - [[-1, 51], 1, Concat, [1]]                  # 56
  - [-1, 2, C3k2, [512, False]]                 # 57 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 58
  - [[-1, 48], 1, Concat, [1]]                  # 59
  - [-1, 2, C3k2, [1024, True]]                 # 60 (P5/32-large)

  - [[54, 57, 60], 1, Detect, [nc]]             # 61 Detect(P3, P4, P5)
