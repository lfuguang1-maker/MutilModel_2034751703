# Ultralytics YOLOMM 🚀 Quad-modal Dual-Tower Full-Fusion Variant (MAGE+BiTE)
# 四模态双塔结构：A 塔 = RGB(3ch)，B 塔 = Event+Thermal+Depth(5ch)，P3/P4/P5 三层 MAGEBiTE 融合
# 对应 UAV 的 yolo11n-mm-mid-magebite-full.yaml（双塔），槽位扩展为四模态物理分组
# 输入: A=rgb(3ch) B=etd(5ch) → fused 8ch
# 数据: data_quad_dual.yaml（modality_used: [rgb, etd]，etd 目录顺序 = event3 + thermal3 + depth1）

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB塔 (层0-10) ==========
  - [-1, 1, Conv, [64, 3, 2], 'A']        # 0-P1/2 RGB塔起始
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (RGB_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  # ========== ETD塔 (层11-21) ==========
  - [-1, 1, Conv, [64, 3, 2], 'B']        # 11-P1/2 ETD塔起始（槽位B）
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15 (ETD_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (ETD_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 (ETD_P5)

  # ========== P3/P4/P5 三层 MAGEBiTE 融合 ==========
  - [[4, 15], 1, MAGEBiTE, []]            # 22 P3融合: RGB_P3(4) + ETD_P3(15)
  - [[6, 17], 1, MAGEBiTE, []]            # 23 P4融合: RGB_P4(6) + ETD_P4(17)
  - [-1, 2, C3k2, [1024, True]]           # 24 (Fused_P4)
  - [[10, 21], 1, MAGEBiTE, []]           # 25 P5融合: RGB_P5(10) + ETD_P5(21)
  - [-1, 2, C3k2, [1024, True]]           # 26
  - [-1, 1, C2PSA, [1024]]                # 27 (Fused_P5)

# 标准YOLOv11检测头
head:
  - [27, 1, nn.Upsample, [None, 2, "nearest"]]  # 28
  - [[-1, 24], 1, Concat, [1]]                  # 29
  - [-1, 2, C3k2, [512, False]]                 # 30

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 31
  - [[-1, 22], 1, Concat, [1]]                  # 32
  - [-1, 2, C3k2, [256, False]]                 # 33 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                  # 34
  - [[-1, 30], 1, Concat, [1]]                  # 35
  - [-1, 2, C3k2, [512, False]]                 # 36 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 37
  - [[-1, 27], 1, Concat, [1]]                  # 38
  - [-1, 2, C3k2, [1024, True]]                 # 39 (P5/32-large)

  - [[33, 36, 39], 1, Detect, [nc]]             # 40 Detect(P3, P4, P5)
